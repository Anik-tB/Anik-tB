name: Update profile stats

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths: ["scripts/generate_stats.py", ".github/workflows/profile-stats.yml"]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --staged --quiet || (git commit -m "chore: update profile stats [skip ci]" && git push)
