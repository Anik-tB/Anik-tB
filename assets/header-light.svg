<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Md Abu Sayum Anik — Software Engineer Profile">
<defs>
  <!-- Background Gradient -->
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2ff"/>
  </linearGradient>

  <!-- Name Text Gradient -->
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0284c7"/>
    <stop offset="50%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#db2777"/>
  </linearGradient>

  <!-- Accent Border Gradient -->
  <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#db2777" stop-opacity="0.5"/>
  </linearGradient>

  <!-- Radial Glow Behind Code Terminal -->
  <radialGradient id="termGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
  </radialGradient>

  <!-- Radial Glow Top Left -->
  <radialGradient id="heroGlow" cx="0.2" cy="0.2" r="0.6">
    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
  </radialGradient>

  <!-- Grid Pattern -->
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.04"/>
  </pattern>

  <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.6">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask">
    <rect width="1200" height="360" fill="url(#gridFade)"/>
  </mask>

  <!-- Glow Filters -->
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40" result="blur"/>
  </filter>
  <filter id="badgeGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>

  <!-- Card Clip -->
  <clipPath id="cardClip">
    <rect width="1200" height="360" rx="18"/>
  </clipPath>
</defs>

<style>
  .kicker { font: 600 13px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; letter-spacing: 0.05em; }
  .name { font: 800 46px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.03em; }
  .role { font: 600 18px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #334155; letter-spacing: -0.01em; }
  .univ { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
  .statusText { font: 600 12px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #059669; }
  .chipText { font: 500 12.5px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #334155; }

  /* Terminal Code Styling */
  .termTitle { font: 500 12px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; fill: #64748b; }
  .codeLine { font: 500 12.5px/1.7 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
  .lineNum { font: 400 12px/1.7 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; fill: #64748b; opacity: 0.45; user-select: none; }

  /* Cursor Blink Animation */
  .cursor {
    fill: #0284c7;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Status Dot Pulse */
  .pulseDot {
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.6; }
  }

  /* Floating Animation for Code Window */
  .floatWindow {
    animation: subtleFloat 8s ease-in-out infinite alternate;
  }
  @keyframes subtleFloat {
    0% { transform: translateY(0); }
    100% { transform: translateY(-5px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .pulseDot, .floatWindow { animation: none; }
  }
</style>

<g clip-path="url(#cardClip)">
  <!-- ▸ Canvas Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- ▸ Background Glow Orbs -->
  <circle cx="220" cy="140" r="160" fill="url(#heroGlow)" filter="url(#softGlow)"/>
  <circle cx="920" cy="180" r="180" fill="url(#termGlow)" filter="url(#softGlow)"/>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: Identity & Highlights                       -->
  <!-- ======================================================== -->

  <!-- 1. Terminal Kicker -->
  <g transform="translate(60, 68)">
    <rect x="-8" y="-16" width="186" height="26" rx="6" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.8"/>
    <text x="4" y="2" class="kicker">
      <tspan fill="#64748b">~/anik $</tspan>
      <tspan fill="#0284c7"> whoami</tspan>
      <tspan class="cursor">_</tspan>
    </text>
  </g>

  <!-- 2. Full Name -->
  <text x="60" y="128" class="name" fill="url(#nameGrad)">Md Abu Sayum Anik</text>

  <!-- 3. Headline Role -->
  <text x="60" y="162" class="role">Software Engineer · Full-Stack &amp; AI Tools</text>

  <!-- 4. University Info -->
  <g transform="translate(60, 188)">
    <text x="0" y="0" class="univ">CSE @ United International University · Dhaka, Bangladesh</text>
  </g>

  <!-- 5. Status Badge -->
  <g transform="translate(60, 216)">
    <rect x="0" y="0" width="206" height="28" rx="14" fill="rgba(5, 150, 105, 0.10)" stroke="rgba(5, 150, 105, 0.25)" stroke-width="1"/>
    <!-- Glowing Status Indicator Dot -->
    <g transform="translate(14, 14)">
      <circle cx="0" cy="0" r="4.5" fill="#059669" filter="url(#badgeGlow)" class="pulseDot"/>
      <circle cx="0" cy="0" r="4" fill="#059669"/>
    </g>
    <text x="27" y="18" class="statusText">Available for opportunities</text>
  </g>

  <!-- 6. Tag Chips Row -->
  <g transform="translate(60, 272)">
    <!-- Chip 1: Full-stack Web -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="32" rx="16" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1"/>
      <!-- Code Icon -->
      <g transform="translate(14, 9)" stroke="#0284c7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="10 4 14 8 10 12"/>
        <polyline points="4 12 0 8 4 4"/>
      </g>
      <text x="36" y="20.5" class="chipText">Full-Stack Web</text>
    </g>

    <!-- Chip 2: Flutter Apps -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="128" height="32" rx="16" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1"/>
      <!-- Mobile Icon -->
      <g transform="translate(14, 8)" stroke="#7c3aed" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="0" width="10" height="15" rx="2"/>
        <line x1="6" y1="12" x2="6.01" y2="12"/>
      </g>
      <text x="34" y="20.5" class="chipText">Flutter Apps</text>
    </g>

    <!-- Chip 3: AI Dev Tools -->
    <g transform="translate(286, 0)">
      <rect x="0" y="0" width="124" height="32" rx="16" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1"/>
      <!-- Sparkle / AI Icon -->
      <g transform="translate(13, 8)" fill="#db2777">
        <path d="M7.5 0 L9 5 L14 6.5 L9 8 L7.5 13 L6 8 L1 6.5 L6 5 Z"/>
      </g>
      <text x="33" y="20.5" class="chipText">AI Dev Tools</text>
    </g>

    <!-- Chip 4: Dhaka, BD -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="112" height="32" rx="16" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1"/>
      <!-- Map Pin Icon (REAL LOCATION PIN) -->
      <g transform="translate(14, 8)" stroke="#0284c7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5.5 C11 9.5 5.5 14 5.5 14 C5.5 14 0 9.5 0 5.5 C0 2.5 2.5 0 5.5 0 C8.5 0 11 2.5 11 5.5 Z"/>
        <circle cx="5.5" cy="5.5" r="2" fill="#0284c7"/>
      </g>
      <text x="33" y="20.5" class="chipText">Dhaka, BD</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT COLUMN: Modern IDE / Code Window Card             -->
  <!-- ======================================================== -->

  <g class="floatWindow" transform="translate(630, 42)">
    <!-- Terminal Box Container -->
    <rect x="0" y="0" width="510" height="276" rx="14" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1"/>
    
    <!-- Top Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 496 0 Q 510 0 510 14 L 510 38 L 0 38 Z" fill="#f1f5f9"/>
    <line x1="0" y1="38" x2="510" y2="38" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.8"/>

    <!-- macOS Window Buttons -->
    <circle cx="20" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="19" r="5" fill="#27c93f"/>

    <!-- Tab Title with file indicator -->
    <text x="74" y="23" class="termTitle">anik.config.ts</text>
    <rect x="420" y="11" width="72" height="18" rx="4" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.7"/>
    <text x="456" y="23" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace" font-size="10" fill="#0284c7">TS 5.7</text>

    <!-- Code Content -->
    <g transform="translate(20, 64)" class="codeLine">
      <!-- Line 1 -->
      <text x="0" y="0">
        <tspan class="lineNum">1 </tspan>
        <tspan fill="#7c3aed">export const</tspan> <tspan fill="#0284c7">developer</tspan> <tspan fill="#64748b">=</tspan> <tspan fill="#64748b">&amp;#123;</tspan>
      </text>

      <!-- Line 2 -->
      <text x="0" y="24">
        <tspan class="lineNum">2 </tspan>
        <tspan fill="#64748b">  </tspan><tspan fill="#0369a1">name</tspan><tspan fill="#64748b">: </tspan><tspan fill="#059669">&quot;Md Abu Sayum Anik&quot;</tspan><tspan fill="#64748b">,</tspan>
      </text>

      <!-- Line 3 -->
      <text x="0" y="48">
        <tspan class="lineNum">3 </tspan>
        <tspan fill="#64748b">  </tspan><tspan fill="#0369a1">focus</tspan><tspan fill="#64748b">: </tspan><tspan fill="#059669">&quot;Full-Stack &amp; AI Systems&quot;</tspan><tspan fill="#64748b">,</tspan>
      </text>

      <!-- Line 4 -->
      <text x="0" y="72">
        <tspan class="lineNum">4 </tspan>
        <tspan fill="#64748b">  </tspan><tspan fill="#0369a1">craft</tspan><tspan fill="#64748b">: </tspan><tspan fill="#64748b">[</tspan><tspan fill="#d97706">&quot;Next.js&quot;</tspan><tspan fill="#64748b">, </tspan><tspan fill="#d97706">&quot;FastAPI&quot;</tspan><tspan fill="#64748b">, </tspan><tspan fill="#d97706">&quot;Flutter&quot;</tspan><tspan fill="#64748b">],</tspan>
      </text>

      <!-- Line 5 -->
      <text x="0" y="96">
        <tspan class="lineNum">5 </tspan>
        <tspan fill="#64748b">  </tspan><tspan fill="#0369a1">building</tspan><tspan fill="#64748b">: </tspan><tspan fill="#db2777">&quot;GenoNexus 🧬&quot;</tspan><tspan fill="#64748b">,</tspan>
      </text>

      <!-- Line 6 -->
      <text x="0" y="120">
        <tspan class="lineNum">6 </tspan>
        <tspan fill="#64748b">  </tspan><tspan fill="#0369a1">highlight</tspan><tspan fill="#64748b">: </tspan><tspan fill="#d97706">&quot;1st Place AOOP Showcase 🏆&quot;</tspan><tspan fill="#64748b">,</tspan>
      </text>

      <!-- Line 7 -->
      <text x="0" y="144">
        <tspan class="lineNum">7 </tspan>
        <tspan fill="#64748b">  </tspan><tspan fill="#0369a1">status</tspan><tspan fill="#64748b">: </tspan><tspan fill="#059669">&quot;open_for_hire&quot;</tspan>
      </text>

      <!-- Line 8 -->
      <text x="0" y="168">
        <tspan class="lineNum">8 </tspan>
        <tspan fill="#64748b">&amp;#125;;</tspan>
        <tspan class="cursor" fill="#0284c7">▋</tspan>
      </text>
    </g>

    <!-- Bottom Accent Line -->
    <line x1="20" y1="262" x2="160" y2="262" stroke="url(#borderGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
</g>

<!-- Outer Card Border -->
<rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1"/>
</svg>
