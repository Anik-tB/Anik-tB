<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Md Abu Sayum Anik — Software Engineer Profile">
<defs>
  <!-- Background Gradient -->
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#060814"/>
    <stop offset="100%" stop-color="#0c1126"/>
  </linearGradient>

  <!-- Name Text Gradient -->
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>

  <!-- Ring Accent Gradient -->
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>

  <!-- Node Border Gradient -->
  <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
  </linearGradient>

  <!-- Grid Pattern -->
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.035"/>
  </pattern>

  <radialGradient id="gridFade" cx="0.45" cy="0.5" r="0.65">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask">
    <rect width="1200" height="360" fill="url(#gridFade)"/>
  </mask>

  <!-- Glow Filter -->
  <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="45"/>
  </filter>
  <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>

  <!-- Card Clip -->
  <clipPath id="cardClip">
    <rect width="1200" height="360" rx="18"/>
  </clipPath>
</defs>

<style>
  .kicker { font: 600 13px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; letter-spacing: 0.05em; }
  .name { font: 800 50px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.03em; }
  .role { font: 600 19px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f1f5f9; letter-spacing: -0.01em; }
  .univ { font: 400 14.5px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94a3b8; }
  .statusText { font: 600 12px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #34d399; }
  .chipText { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
  .nodeText { font: 600 12px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; fill: #e2e8f0; }
  .codeSymbol { font: 700 34px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }

  /* Smooth Spin for Orbit */
  .orbitSpin {
    transform-origin: 945px 180px;
    animation: spinOrbit 45s linear infinite;
  }
  @keyframes spinOrbit {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Pulsing Ambient Orbs */
  .orbFloat1 {
    animation: float1 12s ease-in-out infinite alternate;
  }
  .orbFloat2 {
    animation: float2 15s ease-in-out infinite alternate;
  }
  @keyframes float1 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-20px, 15px); }
  }
  @keyframes float2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(15px, -18px); }
  }

  /* Green Status Pulse */
  .pulseDot {
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(1.35); }
  }

  @media (prefers-reduced-motion: reduce) {
    .orbitSpin, .orbFloat1, .orbFloat2, .pulseDot { animation: none; }
  }
</style>

<g clip-path="url(#cardClip)">
  <!-- ▸ Canvas Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- ▸ Ambient Lighting Behind Right Core -->
  <g filter="url(#blurGlow)" opacity="0.45">
    <circle class="orbFloat1" cx="915" cy="140" r="110" fill="#00d4ff"/>
    <circle class="orbFloat2" cx="985" cy="220" r="100" fill="#8b5cf6"/>
    <circle class="orbFloat1" cx="885" cy="230" r="75" fill="#ec4899"/>
    <circle cx="200" cy="140" r="100" fill="#00d4ff" opacity="0.35"/>
  </g>

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: Profile Info (100% Real Data)               -->
  <!-- ======================================================== -->

  <!-- 1. Terminal Kicker -->
  <g transform="translate(64, 70)">
    <rect x="-8" y="-17" width="186" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="4" y="2" class="kicker">
      <tspan fill="#94a3b8">~/anik-tb</tspan>
      <tspan fill="#00d4ff"> $ whoami</tspan>
    </text>
  </g>

  <!-- 2. Full Name -->
  <text x="62" y="132" class="name" fill="url(#nameGrad)">Md Abu Sayum Anik</text>

  <!-- 3. Headline Role -->
  <text x="64" y="170" class="role">Software Engineer · Full-Stack &amp; AI Tools</text>

  <!-- 4. University Info -->
  <text x="64" y="198" class="univ">CSE @ United International University · Dhaka, Bangladesh</text>

  <!-- 5. Status Badge -->
  <g transform="translate(64, 222)">
    <rect x="0" y="0" width="206" height="28" rx="14" fill="rgba(16, 185, 129, 0.10)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <circle cx="0" cy="0" r="4.5" fill="#10b981" filter="url(#dotGlow)" class="pulseDot"/>
      <circle cx="0" cy="0" r="4" fill="#10b981"/>
    </g>
    <text x="27" y="18" class="statusText">Available for opportunities</text>
  </g>

  <!-- 6. Tag Chips Row -->
  <g transform="translate(64, 274)">
    <!-- Chip 1: Full-stack Web -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="144" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <!-- Code Icon -->
      <g transform="translate(14, 10)" stroke="#00d4ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="10 4 14 8 10 12"/>
        <polyline points="4 12 0 8 4 4"/>
      </g>
      <text x="37" y="21.5" class="chipText">Full-Stack Web</text>
    </g>

    <!-- Chip 2: Flutter Apps -->
    <g transform="translate(154, 0)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <!-- Mobile Icon -->
      <g transform="translate(14, 9)" stroke="#8b5cf6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="0" width="10" height="15" rx="2"/>
        <line x1="6" y1="12" x2="6.01" y2="12"/>
      </g>
      <text x="35" y="21.5" class="chipText">Flutter Apps</text>
    </g>

    <!-- Chip 3: AI Dev Tools -->
    <g transform="translate(294, 0)">
      <rect x="0" y="0" width="128" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <!-- Sparkle / AI Icon -->
      <g transform="translate(13, 9)" fill="#ec4899">
        <path d="M7.5 0 L9 5 L14 6.5 L9 8 L7.5 13 L6 8 L1 6.5 L6 5 Z"/>
      </g>
      <text x="34" y="21.5" class="chipText">AI Dev Tools</text>
    </g>

    <!-- Chip 4: Dhaka, BD -->
    <g transform="translate(432, 0)">
      <rect x="0" y="0" width="116" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <!-- Location Map Pin Icon -->
      <g transform="translate(14, 9)" stroke="#00d4ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5.5 C11 9.5 5.5 14 5.5 14 C5.5 14 0 9.5 0 5.5 C0 2.5 2.5 0 5.5 0 C8.5 0 11 2.5 11 5.5 Z"/>
        <circle cx="5.5" cy="5.5" r="2" fill="#00d4ff"/>
      </g>
      <text x="34" y="21.5" class="chipText">Dhaka, BD</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT COLUMN: Modern Tech Core with Real Stack           -->
  <!-- ======================================================== -->

  <!-- Concentric Orbital Cyber Rings -->
  <g fill="none">
    <!-- Outer dashed orbit -->
    <circle cx="945" cy="180" r="142" stroke="url(#ringGrad)" stroke-width="1.2" stroke-dasharray="3 8" opacity="0.4"/>
    <!-- Middle ring -->
    <circle cx="945" cy="180" r="110" stroke="url(#ringGrad)" stroke-width="1.6" opacity="0.75"/>
    <!-- Inner dashed ring -->
    <circle cx="945" cy="180" r="78" stroke="url(#ringGrad)" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.4"/>
  </g>

  <!-- Orbiting Satellites (Rotates around cx, cy) -->
  <g class="orbitSpin">
    <circle cx="1087" cy="180" r="5.5" fill="#00d4ff"/>
    <circle cx="945" cy="70" r="4.5" fill="#8b5cf6"/>
    <circle cx="867" cy="180" r="4" fill="#ec4899"/>
    <circle cx="945" cy="322" r="3.5" fill="#00d4ff"/>
  </g>

  <!-- Real Tech Badges Positioned Around Core -->
  <!-- 1. Next.js 15 (Top) -->
  <g transform="translate(897, 34)">
    <rect x="0" y="0" width="96" height="28" rx="14" fill="rgba(12, 18, 40, 0.90)" stroke="url(#nodeGrad)" stroke-width="1"/>
    <text x="48" y="18" text-anchor="middle" class="nodeText">Next.js 15</text>
  </g>

  <!-- 2. Python (Right) -->
  <g transform="translate(1049, 166)">
    <rect x="0" y="0" width="84" height="28" rx="14" fill="rgba(12, 18, 40, 0.90)" stroke="url(#nodeGrad)" stroke-width="1"/>
    <text x="42" y="18" text-anchor="middle" class="nodeText">Python</text>
  </g>

  <!-- 3. Flutter (Bottom) -->
  <g transform="translate(901, 298)">
    <rect x="0" y="0" width="88" height="28" rx="14" fill="rgba(12, 18, 40, 0.90)" stroke="url(#nodeGrad)" stroke-width="1"/>
    <text x="44" y="18" text-anchor="middle" class="nodeText">Flutter</text>
  </g>

  <!-- 4. FastAPI (Left) -->
  <g transform="translate(757, 166)">
    <rect x="0" y="0" width="84" height="28" rx="14" fill="rgba(12, 18, 40, 0.90)" stroke="url(#nodeGrad)" stroke-width="1"/>
    <text x="42" y="18" text-anchor="middle" class="nodeText">FastAPI</text>
  </g>

  <!-- Central Hub Circle with </> Symbol -->
  <circle cx="945" cy="180" r="52" fill="#0c1228" stroke="url(#ringGrad)" stroke-width="2"/>
  <circle cx="945" cy="180" r="45" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <text x="945" y="191" text-anchor="middle" class="codeSymbol" fill="url(#nameGrad)">&lt;/&gt;</text>
</g>

<!-- Outer Card Border -->
<rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1"/>
</svg>
